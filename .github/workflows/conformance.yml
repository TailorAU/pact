name: PACT Conformance

# Track T10 (docs/v2-plan.yaml): conformance gates that run on protocol,
# runner, MCP-guard, and reference-server changes. The original v2.0 scaffold
# and all-green server jobs remain; the v2.3 draft job executes the complete
# vector set with an exact expected-failure manifest for unbuilt §25 behavior.

on:
  push:
    branches: [main]
    paths:
      - 'spec/**'
      - 'mcp/**'
      - 'reference-server/**'
      - 'tools/matter-smoke.sh'
      - 'tools/check-conformance-expected-failures.mjs'
      - 'tools/check-conformance-expected-failures.test.mjs'
      - '.github/conformance/v2.3-reference-server-expected-failures.json'
      - 'docs/v2-prep/matters-**'
      - '.github/workflows/conformance.yml'
  pull_request:
    branches: [main]
    paths:
      - 'spec/**'
      - 'mcp/**'
      - 'reference-server/**'
      - 'tools/matter-smoke.sh'
      - 'tools/check-conformance-expected-failures.mjs'
      - 'tools/check-conformance-expected-failures.test.mjs'
      - '.github/conformance/v2.3-reference-server-expected-failures.json'
      - 'docs/v2-prep/matters-**'
      - '.github/workflows/conformance.yml'

permissions:
  contents: read

jobs:
  conformance-scaffold:
    name: Conformance scaffold checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install YAML tooling
        run: npm install --no-save js-yaml

      - name: Conformance directory exists
        run: |
          test -d spec/v2.0/conformance || { echo "spec/v2.0/conformance/ missing"; exit 1; }
          test -f spec/v2.0/conformance/README.md || { echo "conformance README missing"; exit 1; }
          test -f spec/v2.0/conformance/test-vector-format.yaml || { echo "test-vector-format.yaml missing"; exit 1; }
          echo "Conformance scaffold present."

      - name: Test-vector format file parses as YAML
        run: |
          node -e "require('js-yaml').load(require('fs').readFileSync('spec/v2.0/conformance/test-vector-format.yaml','utf8')); console.log('test-vector-format.yaml OK');"

      - name: Build & run the conformance runner (verification vectors)
        # Runs spec/v2.0/conformance/runner against all vectors under
        # spec/v2.0/conformance/. kind:verification vectors execute fully;
        # kind:http + kind:session vectors SKIP here (no --server) — they
        # are executed end-to-end in the `conformance-server` job below.
        # See spec/v2.0/conformance/runner/README.md for what's covered vs TODO.
        working-directory: spec/v2.0/conformance/runner
        run: |
          npm ci || npm install
          npm run build
          node dist/index.js run --vectors ..

  conformance-server:
    name: Conformance runner against the reference server
    runs-on: ubuntu-latest
    # Executes the server-bound vectors (kind:http + kind:session) against
    # the in-memory @pact-protocol/reference-server so HTTP/session
    # regressions are caught in CI (they were previously undetectable —
    # the runner skipped every server-bound vector without a --server).
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build the reference server
        working-directory: reference-server
        run: |
          npm ci || npm install
          npm run build

      - name: Build the conformance runner
        working-directory: spec/v2.0/conformance/runner
        run: |
          npm ci || npm install
          npm run build

      - name: Start the reference server (background) + wait for port
        working-directory: reference-server
        run: |
          PACT_REF_PORT=4100
          echo "PACT_REF_PORT=$PACT_REF_PORT" >> "$GITHUB_ENV"
          # Background-start; capture pid for teardown; tee log so a
          # failed start is visible in the workflow output.
          nohup node dist/server.js --port "$PACT_REF_PORT" > server.log 2>&1 &
          echo "REF_SERVER_PID=$!" >> "$GITHUB_ENV"
          # Wait-for-port: poll /healthz for up to ~30s, fail LOUDLY if the
          # server never comes up (don't let the runner skip silently).
          for i in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:${PACT_REF_PORT}/healthz" > /dev/null 2>&1; then
              echo "Reference server is up after ${i} attempt(s)."
              curl -fsS "http://127.0.0.1:${PACT_REF_PORT}/healthz"; echo
              exit 0
            fi
            sleep 0.5
          done
          echo "::error::Reference server did not become healthy on port ${PACT_REF_PORT} within 30s."
          echo "----- server.log -----"
          cat server.log || true
          exit 1

      - name: Run the conformance suite against the reference server
        working-directory: spec/v2.0/conformance/runner
        # Expect every server-bound vector to EXECUTE and PASS. The runner
        # exits non-zero on any failure; a server-bound vector that SKIPs
        # (server unreachable) would surface as the scaffold's stderr
        # WARNING and a non-green local run — here the wait-for-port step
        # above already guarantees the server is reachable.
        run: |
          node dist/index.js run --vectors .. --server "http://127.0.0.1:${PACT_REF_PORT}"

      - name: Stop the reference server
        if: always()
        run: |
          if [ -n "${REF_SERVER_PID:-}" ]; then
            kill "${REF_SERVER_PID}" 2>/dev/null || true
          fi
          echo "----- reference-server/server.log -----"
          cat reference-server/server.log 2>/dev/null || true

  conformance-v23-reference:
    name: v2.3 reference coverage (6 tracked §25 gaps)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Executes every v2.3 vector. The mandate and verification families run
    # locally in the runner; HTTP/session vectors run against the reference
    # server with acknowledged per-vector fixture resets and Matter-state
    # materialisation. Six §25 vectors are
    # tracked exact-set expected failures until the execution boundary lands.
    # `expected_events` and `postconditions` remain deferred runner features,
    # so this job currently proves local guard + HTTP/status/body coverage.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test the exact expected-failure gate
        run: node --test tools/check-conformance-expected-failures.test.mjs

      - name: Build the MCP mandate guard
        working-directory: mcp
        run: |
          npm ci
          npm run build

      - name: Build the reference server
        working-directory: reference-server
        run: |
          npm ci
          npm run build

      - name: Build the v2.3 conformance runner
        working-directory: spec/v2.3/conformance/runner
        run: |
          npm ci
          npm run build

      - name: Start the reference server + wait for health
        working-directory: reference-server
        run: |
          PACT_REF_PORT=4123
          echo "PACT_V23_REF_PORT=$PACT_REF_PORT" >> "$GITHUB_ENV"
          nohup node dist/server.js --port "$PACT_REF_PORT" > v23-server.log 2>&1 &
          echo "V23_REF_SERVER_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:${PACT_REF_PORT}/healthz" > /dev/null 2>&1; then
              echo "Reference server is up after ${i} attempt(s)."
              exit 0
            fi
            sleep 0.5
          done
          echo "::error::Reference server did not become healthy on port ${PACT_REF_PORT} within 30s."
          cat v23-server.log || true
          exit 1

      - name: Run all v2.3 vectors and enforce the exact failure set
        working-directory: spec/v2.3/conformance/runner
        run: |
          set +e
          node dist/index.js run \
            --vectors .. \
            --server "http://127.0.0.1:${PACT_V23_REF_PORT}" \
            --require-reference-fixtures \
            --json > "$GITHUB_WORKSPACE/v23-conformance-report.json"
          runner_status=$?
          set -e

          cat "$GITHUB_WORKSPACE/v23-conformance-report.json"
          if [ "$runner_status" -gt 1 ]; then
            echo "::error::v2.3 runner crashed or its required reference-fixture harness failed (exit ${runner_status})."
            exit "$runner_status"
          fi

          node "$GITHUB_WORKSPACE/tools/check-conformance-expected-failures.mjs" \
            "$GITHUB_WORKSPACE/v23-conformance-report.json" \
            "$GITHUB_WORKSPACE/.github/conformance/v2.3-reference-server-expected-failures.json"

      - name: Stamp spec + vector-set provenance into the report
        # if: always() — the report of a failing run must still be enriched so
        # the artifact below carries provenance even when the gate is red.
        # Enriching in CI (jq over the emitted JSON) rather than in the runner
        # keeps the diff to this workflow: no runner change, no runner release.
        # The expected-failures gate above reads only `results` and `counts`,
        # so the added top-level keys cannot affect it — and it has already
        # run against this file by the time we stamp.
        if: always()
        run: |
          REPORT="$GITHUB_WORKSPACE/v23-conformance-report.json"
          if [ ! -s "$REPORT" ]; then
            echo "No report was produced (runner crashed before writing) — nothing to stamp."
            exit 0
          fi
          if ! jq empty "$REPORT" 2>/dev/null; then
            echo "Report is not valid JSON — publishing it as-is without provenance."
            exit 0
          fi
          # spec_version: the spec generation this job's vector set targets
          # (the job is hard-bound to spec/v2.3/** throughout).
          # vector_set_ref: the commit actually checked out — for pull_request
          # events GITHUB_SHA is the merge commit, which is exactly the tree
          # the vectors were read from.
          jq --arg spec_version "2.3" --arg vector_set_ref "$GITHUB_SHA" \
            '. + { spec_version: $spec_version, vector_set_ref: $vector_set_ref }' \
            "$REPORT" > "$REPORT.tmp"
          mv "$REPORT.tmp" "$REPORT"
          echo "Stamped provenance:"
          jq '{ spec_version, vector_set_ref, counts }' "$REPORT"

      - name: Publish the v2.3 conformance report artifact
        # if: always() — the report of a FAILING run is exactly the evidence
        # tailor-app#5567 wants preserved: a red expected-failures gate must
        # still publish what actually ran so the failure can be audited from
        # the artifact rather than reconstructed from logs.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v23-conformance-report
          path: v23-conformance-report.json
          # The runner can crash (exit > 1) before writing the report; the job
          # is already red from the run step, so a missing file only warns.
          if-no-files-found: warn

      - name: Stop the v2.3 reference server
        if: always()
        run: |
          if [ -n "${V23_REF_SERVER_PID:-}" ]; then
            kill "${V23_REF_SERVER_PID}" 2>/dev/null || true
          fi
          echo "----- reference-server/v23-server.log -----"
          cat reference-server/v23-server.log 2>/dev/null || true

  matter-smoke:
    name: Matter primitive smoke test (v2.2 draft)
    runs-on: ubuntu-latest
    # tools/matter-smoke.sh exercises every §24 Matter endpoint end-to-end
    # (20 assertions across 9 scenarios). The script starts and stops its
    # own copy of the reference server, so this job is independent of the
    # `conformance-server` job above. Drafts live under docs/v2-prep/
    # matters-* until v2.2 is properly opened; the smoke test guards the
    # implementation in the meantime.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build the reference server
        working-directory: reference-server
        run: |
          npm ci || npm install
          npm run build

      - name: Ensure python3 + curl available
        run: |
          which python3 || (sudo apt-get update -qq && sudo apt-get install -y python3)
          which curl    || (sudo apt-get update -qq && sudo apt-get install -y curl)

      - name: Run tools/matter-smoke.sh
        run: |
          chmod +x tools/matter-smoke.sh
          ./tools/matter-smoke.sh 4111
