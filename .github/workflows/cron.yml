name: "Cron — PACT Knowledge Graph Maintenance"

# Scheduled maintenance for the knowledge graph at pact.tailor.au.
#
# Re-homed from tailor-app's cron-source.yml, which tailor-app#5954 retired
# together with its secrets when the KG moved here (tailor-group#9). Same
# jobs, same cadence. The bearer is the `prod` environment's CRON_SECRET —
# the same secret cd-kg.yml's build-and-deploy job (environment: prod)
# deploys into the pact-web container app, so the credential has exactly one
# source. Every job below declares that environment for the same reason: an
# environment secret is empty in a job that does not, which is how the first
# auth-check run answered 401 (tailor-group#9). `prod` has no required
# reviewers, so scheduled runs never wait on anyone.
#
# GitHub runs `schedule` triggers from the DEFAULT branch only. The KG deploys
# from `rehome-review` until tailor-group#7 step 3 promotes it, so until then
# the schedules below are inert and every job is reachable by hand:
#
#   gh workflow run cron.yml --repo TailorAU/pact --ref rehome-review -f job=auth-check
#
# GitHub only lists (and only dispatches) a workflow that has run at least
# once, or that lives on the default branch — a schedule + dispatch file on
# rehome-review alone never gets that first run and `workflow run` answers
# 404. The `push` trigger below, limited to this file's own path, is that
# first run: every job's `if:` ignores a push, so the run does nothing but
# register the workflow. Drop it at promotion or leave it; it is harmless.
#
# The consensus sweep does not wait for promotion: the server runs its own
# in-process heartbeat (src/lib/consensus-heartbeat.ts) on the same engine
# entry point, under the same Postgres advisory lock.

on:
  push:
    branches: [rehome-review]
    paths: [".github/workflows/cron.yml"]
  schedule:
    # Cleanup: daily at 3am UTC
    - cron: "0 3 * * *"
    # Yield distribution: Sunday at 4am UTC
    - cron: "0 4 * * 0"
    # Staleness check: daily at 5am UTC
    - cron: "0 5 * * *"
    # Legislation sync: Sunday at 6am UTC (4pm AEST)
    - cron: "0 6 * * 0"
    # Logan ArcGIS spatial snapshot: daily at 2am UTC (#874)
    - cron: "0 2 * * *"
    # Translink SEQ GTFS sync: Monday at 17:00 UTC (3am AEST Tuesday) (#875)
    - cron: "0 17 * * 1"
    # QLD fiscal reconstruction: daily at 18:00 UTC (4am AEST) (#3053)
    - cron: "0 18 * * *"
    # Consensus sweep (Silence=Consent auto-merge + topic approve/reject
    # evaluation): every 30 minutes (#5425 — the engine does not run on GET
    # traffic; the route holds a Postgres advisory lock so overlapping runs,
    # including the in-process heartbeat's, skip rather than double-run)
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      job:
        description: "Which cron job to run"
        required: true
        type: choice
        options:
          - auth-check
          - cleanup
          - yield
          - staleness
          - legislation-sync
          - spatial-snapshot
          - gtfs-sync
          - fiscal-sync
          - auto-merge
          - all

permissions:
  contents: read

env:
  # The ONLY base. Never "fix" a redirect here by adding `-L` to a curl: that
  # would forward the `Authorization: Bearer` cron secret to whatever host
  # the redirect names (tailor-app#5582). Pin the correct host instead.
  PACT_URL: https://pact.tailor.au

jobs:
  auth-check:
    name: Cron Authentication Check (manual, read-only)
    runs-on: ubuntu-latest
    environment: prod
    if: github.event_name == 'workflow_dispatch' && inputs.job == 'auth-check'
    steps:
      - name: Verify deployed cron authentication
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          RESPONSE_FILE="$RUNNER_TEMP/pact-cron-auth-check.json"
          trap 'rm -f "$RESPONSE_FILE"' EXIT
          STATUS=$(curl --silent --show-error \
            --connect-timeout 10 --max-time 30 --max-redirs 0 \
            --proto '=https' --tlsv1.2 \
            --output "$RESPONSE_FILE" --write-out '%{http_code}' \
            --header "Authorization: Bearer $CRON_SECRET" \
            "${{ env.PACT_URL }}/api/cron/auth-check")
          echo "HTTP Status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::error::Cron authentication check failed with status $STATUS"
            exit 1
          fi
          if ! jq --exit-status \
            'type == "object" and length == 1 and .status == "ok"' \
            "$RESPONSE_FILE" > /dev/null; then
            echo "::error::Cron authentication check returned an invalid response"
            exit 1
          fi

  cleanup:
    name: Cleanup (daily 3am UTC)
    runs-on: ubuntu-latest
    environment: prod
    if: >-
      github.event.schedule == '0 3 * * *' ||
      github.event_name == 'workflow_dispatch' && (inputs.job == 'cleanup' || inputs.job == 'all')
    steps:
      - name: Run cleanup cron
        run: |
          STATUS=$(curl -s -D "$RUNNER_TEMP/cron-response-headers.txt" -o "$RUNNER_TEMP/cron-response.json" -w '%{http_code}' --max-time 300 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ env.PACT_URL }}/api/cron/cleanup")
          echo "HTTP Status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Response headers:"
            cat "$RUNNER_TEMP/cron-response-headers.txt" || true
            echo "Response body (first 2000 bytes):"
            head -c 2000 "$RUNNER_TEMP/cron-response.json" || true
            echo
          fi
          if [ "$STATUS" != "200" ]; then
            echo "::error::Cleanup cron failed with status $STATUS"
            exit 1
          fi

  yield:
    name: Yield Distribution (Sunday 4am UTC)
    runs-on: ubuntu-latest
    environment: prod
    if: >-
      github.event.schedule == '0 4 * * 0' ||
      github.event_name == 'workflow_dispatch' && (inputs.job == 'yield' || inputs.job == 'all')
    steps:
      - name: Run yield cron
        run: |
          STATUS=$(curl -s -D "$RUNNER_TEMP/cron-response-headers.txt" -o "$RUNNER_TEMP/cron-response.json" -w '%{http_code}' --max-time 300 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ env.PACT_URL }}/api/cron/yield")
          echo "HTTP Status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Response headers:"
            cat "$RUNNER_TEMP/cron-response-headers.txt" || true
            echo "Response body (first 2000 bytes):"
            head -c 2000 "$RUNNER_TEMP/cron-response.json" || true
            echo
          fi
          if [ "$STATUS" != "200" ]; then
            echo "::error::Yield cron failed with status $STATUS"
            exit 1
          fi

  staleness:
    name: Staleness Check (daily 5am UTC)
    runs-on: ubuntu-latest
    environment: prod
    if: >-
      github.event.schedule == '0 5 * * *' ||
      github.event_name == 'workflow_dispatch' && (inputs.job == 'staleness' || inputs.job == 'all')
    steps:
      - name: Run staleness cron
        run: |
          STATUS=$(curl -s -D "$RUNNER_TEMP/cron-response-headers.txt" -o "$RUNNER_TEMP/cron-response.json" -w '%{http_code}' --max-time 300 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ env.PACT_URL }}/api/cron/staleness")
          echo "HTTP Status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Response headers:"
            cat "$RUNNER_TEMP/cron-response-headers.txt" || true
            echo "Response body (first 2000 bytes):"
            head -c 2000 "$RUNNER_TEMP/cron-response.json" || true
            echo
          fi
          if [ "$STATUS" != "200" ]; then
            echo "::error::Staleness cron failed with status $STATUS"
            exit 1
          fi

  legislation-sync:
    name: Legislation Sync (Sunday 6am UTC)
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 30
    if: >-
      github.event.schedule == '0 6 * * 0' ||
      github.event_name == 'workflow_dispatch' && (inputs.job == 'legislation-sync' || inputs.job == 'all')
    steps:
      # tailor-group#38 — the sync takes minutes and pact.tailor.au sits
      # behind a Next.js rewrite proxy with a 30 s timeout, so the route no
      # longer runs it inside the request: it starts the sync detached under
      # a Postgres advisory lock and answers 202 at once. This step triggers,
      # then polls /status every 30 s until the lock is free and every
      # targeted jurisdiction's latest legislation_sync_log row is at least
      # as new as the trigger and has a completedAt. 54 polls = 27 min,
      # inside timeout-minutes: 30 with the trigger's own budget to spare.
      - name: Run legislation sync cron and poll until it completes
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          BASE="${{ env.PACT_URL }}/api/cron/legislation-sync"
          HEADERS="$RUNNER_TEMP/cron-response-headers.txt"
          BODY="$RUNNER_TEMP/cron-response.json"
          dump() {
            echo "Response headers:"
            cat "$HEADERS" || true
            echo "Response body (first 2000 bytes):"
            head -c 2000 "$BODY" || true
            echo
          }
          fail() {
            dump
            echo "::error::$1"
            exit 1
          }

          STATUS=$(curl -s -D "$HEADERS" -o "$BODY" -w '%{http_code}' --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$BASE")
          echo "HTTP Status: $STATUS"
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "202" ]; then
            fail "Legislation sync trigger failed with status $STATUS"
          fi
          if ! jq -e 'type == "object"' "$BODY" > /dev/null 2>&1; then
            fail "Legislation sync trigger returned a body that is not a JSON object"
          fi

          if [ "$STATUS" = "200" ]; then
            # The route ran synchronously (?wait=1 semantics): results are in the body.
            if ! jq -e '.results | type == "array"' "$BODY" > /dev/null; then
              fail "Legislation sync answered 200 without a results array"
            fi
            jq -r '.results[] | "\(.jurisdiction): docsChecked=\(.docsChecked) docsUpdated=\(.docsUpdated) sectionsTotal=\(.sectionsTotal) errors=\(.errors | length) crashes=\(.parserCrashCount) anomalies=\(.parserAnomalyCount)"' "$BODY"
            exit 0
          fi

          if ! jq -e '(.started | type == "boolean") and (.jurisdictions | type == "array" and length > 0)' "$BODY" > /dev/null; then
            fail "Legislation sync answered 202 without started/jurisdictions"
          fi
          TARGETS=$(jq -c '.jurisdictions' "$BODY")
          if [ "$(jq -r '.started' "$BODY")" = "true" ]; then
            SINCE=$(jq -r '.startedAt' "$BODY")
            echo "Started job $(jq -r '.jobId' "$BODY") at $SINCE for $TARGETS"
          else
            SINCE=""
            echo "::warning::A legislation sync was already running; waiting for it instead (its rows may predate this trigger)"
          fi

          for POLL in $(seq 1 54); do
            sleep 30
            STATUS=$(curl -s -D "$HEADERS" -o "$BODY" -w '%{http_code}' --max-time 30 \
              -H "Authorization: Bearer $CRON_SECRET" \
              "$BASE/status")
            if [ "$STATUS" != "200" ]; then
              fail "Legislation sync status poll $POLL failed with status $STATUS"
            fi
            if ! jq -e '(.running | type == "boolean") and (.runs | type == "array")' "$BODY" > /dev/null 2>&1; then
              fail "Legislation sync status poll $POLL returned an invalid response"
            fi
            if jq -e --arg since "$SINCE" --argjson targets "$TARGETS" '
              def ts: sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601;
              . as $doc
              | ($doc.running == false)
                and all($targets[]; . as $j
                  | ([$doc.runs[] | select(.jurisdiction == $j)] | first // null) as $r
                  | $r != null
                    and $r.completedAt != null
                    and ($since == "" or (($r.startedAt | ts) >= ($since | ts))))
            ' "$BODY" > /dev/null; then
              jq -r --argjson targets "$TARGETS" '
                .runs[] | select(.jurisdiction as $j | $targets | index($j))
                | "\(.jurisdiction): docsChecked=\(.docsChecked) docsUpdated=\(.docsUpdated) sectionsTotal=\(.sectionsTotal) errors=\(.errors | length) crashes=\(.parserCrashCount) anomalies=\(.parserAnomalyCount) silentZero=\(.silentZeroFlag) startedAt=\(.startedAt) completedAt=\(.completedAt)"
              ' "$BODY"
              exit 0
            fi
            echo "poll $POLL/54: running=$(jq -r '.running' "$BODY"); waiting"
          done
          fail "Legislation sync did not complete within the polling budget (27 min)"

  spatial-snapshot:
    name: Logan ArcGIS Spatial Snapshot (daily 2am UTC) — Refs #874
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 30
    if: >-
      github.event.schedule == '0 2 * * *' ||
      github.event_name == 'workflow_dispatch' && (inputs.job == 'spatial-snapshot' || inputs.job == 'all')
    steps:
      - name: Run spatial snapshot cron
        run: |
          STATUS=$(curl -s -D "$RUNNER_TEMP/cron-response-headers.txt" -o "$RUNNER_TEMP/cron-response.json" -w '%{http_code}' --max-time 900 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ env.PACT_URL }}/api/cron/spatial-snapshot")
          echo "HTTP Status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Response headers:"
            cat "$RUNNER_TEMP/cron-response-headers.txt" || true
            echo "Response body (first 2000 bytes):"
            head -c 2000 "$RUNNER_TEMP/cron-response.json" || true
            echo
          fi
          # Distinguish "we are unreachable" from "ArcGIS throttled a layer".
          # A transport failure, a redirect, or a 4xx is OUR endpoint being
          # wrong (tailor-app#5582). Upstream 5xx stays non-fatal, which is
          # what the tolerance was always for.
          if [ "$STATUS" = "000" ]; then
            echo "::error::Spatial snapshot could not connect to our own endpoint."
            exit 1
          fi
          if [ "$STATUS" -ge 300 ] && [ "$STATUS" -lt 500 ]; then
            echo "::error::Spatial snapshot got $STATUS from our own endpoint — a redirect or client error, not an ArcGIS throttle."
            exit 1
          fi
          if [ "$STATUS" != "200" ]; then
            echo "::warning::Spatial snapshot returned $STATUS — layer errors are non-fatal (ArcGIS may throttle). Check logs."
          fi

  gtfs-sync:
    name: Translink SEQ GTFS Sync (Monday 17:00 UTC = 3am AEST Tuesday) — Refs #875
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 30
    if: >-
      github.event.schedule == '0 17 * * 1' ||
      github.event_name == 'workflow_dispatch' && (inputs.job == 'gtfs-sync' || inputs.job == 'all')
    steps:
      - name: Run GTFS sync cron
        run: |
          STATUS=$(curl -s -D "$RUNNER_TEMP/cron-response-headers.txt" -o "$RUNNER_TEMP/cron-response.json" -w '%{http_code}' --max-time 1200 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ env.PACT_URL }}/api/cron/gtfs-sync")
          echo "HTTP Status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Response headers:"
            cat "$RUNNER_TEMP/cron-response-headers.txt" || true
            echo "Response body (first 2000 bytes):"
            head -c 2000 "$RUNNER_TEMP/cron-response.json" || true
            echo
          fi
          if [ "$STATUS" != "200" ]; then
            echo "::error::GTFS sync failed with status $STATUS"
            exit 1
          fi

  auto-merge:
    name: Consensus Sweep (every 30 min) — Refs #5425
    runs-on: ubuntu-latest
    environment: prod
    if: >-
      github.event.schedule == '*/30 * * * *' ||
      github.event_name == 'workflow_dispatch' && (inputs.job == 'auto-merge' || inputs.job == 'all')
    steps:
      - name: Run consensus sweep cron
        run: |
          STATUS=$(curl -s -D "$RUNNER_TEMP/cron-response-headers.txt" -o "$RUNNER_TEMP/cron-response.json" -w '%{http_code}' --max-time 300 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ env.PACT_URL }}/api/cron/auto-merge")
          echo "HTTP Status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Response headers:"
            cat "$RUNNER_TEMP/cron-response-headers.txt" || true
            echo "Response body (first 2000 bytes):"
            head -c 2000 "$RUNNER_TEMP/cron-response.json" || true
            echo
          fi
          if [ "$STATUS" != "200" ]; then
            echo "::error::Consensus sweep failed with status $STATUS"
            exit 1
          fi

  fiscal-sync:
    name: QLD Fiscal Reconstruction (daily 18:00 UTC = 4am AEST) — Refs #3053
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 30
    if: >-
      github.event.schedule == '0 18 * * *' ||
      github.event_name == 'workflow_dispatch' && (inputs.job == 'fiscal-sync' || inputs.job == 'all')
    steps:
      - name: Run fiscal sync cron
        run: |
          STATUS=$(curl -s -D "$RUNNER_TEMP/cron-response-headers.txt" -o "$RUNNER_TEMP/cron-response.json" -w '%{http_code}' --max-time 900 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ env.PACT_URL }}/api/cron/fiscal-sync")
          echo "HTTP Status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Response headers:"
            cat "$RUNNER_TEMP/cron-response-headers.txt" || true
            echo "Response body (first 2000 bytes):"
            head -c 2000 "$RUNNER_TEMP/cron-response.json" || true
            echo
          fi
          if [ "$STATUS" != "200" ]; then
            echo "::error::Fiscal sync failed with status $STATUS"
            exit 1
          fi
