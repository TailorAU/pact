name: Publish CLI, MCP and conformance vectors
# Publishes the coordination CLI, the MCP server, and the v2.3 conformance
# vector corpus to npm.
# SCOPE-NEUTRAL: package names are read from each package.json at runtime, so
# this workflow is correct before AND after the #5 scope rename — it needs no
# edit when @pact-protocol/* becomes the decided published scope.
# Auth: NPM_TOKEN repo secret (does not exist until the #5 Knox gate clears;
# the guard below fails fast with an actionable message instead of a cryptic 401).

on:
  workflow_dispatch: {}
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # npm provenance attestation

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      NPM_CONFIG_PROVENANCE: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Guard — NPM_TOKEN must be available
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is not set on TailorAU/pact. This is the #5 Knox gate: create the decided npm org (pact-spec; fallback @pact_ which is already Tailor-owned), mint a publish-scoped automation token, add it as the NPM_TOKEN repo secret, then re-run."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Test — cli (typecheck)
        working-directory: cli
        run: |
          npm ci
          npm run typecheck

      - name: Test — mcp (build + node --test)
        working-directory: mcp
        run: |
          npm ci
          npm test

      # No npm ci: the vectors package has no dependencies by design — it is
      # spec fixtures, not code. The gate asserts the shipped corpus matches
      # .github/conformance/v2.3-reference-server-expected-failures.json
      # exactly, in both directions, so a vector cannot be added or dropped
      # from the tarball without a deliberate manifest update.
      - name: Test — conformance-vectors (exact inventory)
        working-directory: spec/v2.3/conformance
        run: npm test

      - name: Publish (version-gated, both packages)
        run: |
          set -euo pipefail
          for dir in cli mcp spec/v2.3/conformance; do
            PKG=$(node -p "require('./$dir/package.json').name")
            VER=$(node -p "require('./$dir/package.json').version")
            if npm view "$PKG@$VER" version >/dev/null 2>&1; then
              echo "skip: $PKG@$VER already on the registry"
              continue
            fi
            echo "publishing $PKG@$VER"
            (cd "$dir" && npm publish --access public)
          done

      - name: Verify on registry
        run: |
          set -euo pipefail
          for dir in cli mcp spec/v2.3/conformance; do
            PKG=$(node -p "require('./$dir/package.json').name")
            VER=$(node -p "require('./$dir/package.json').version")
            echo "OK: $PKG@$VER -> $(npm view "$PKG@$VER" dist.tarball)"
          done
