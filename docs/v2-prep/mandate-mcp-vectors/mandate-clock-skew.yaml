# Conformance test vector — Extended: client clock drift beyond the window rejected.
# kind: mandate (provisional) — SOQ2 ratified skew: §17.7's ±5 minutes, NOT the RFC draft's 30 s.

kind: mandate

metadata:
  id: extended/mandate-mcp/mandate-clock-skew
  description: >
    A mandate asserted more than the configured skew window in the future
    (here: 10 minutes ahead against a ±300 s window) indicates client clock
    drift and is rejected with MandateClockSkew (-32017). The server clock is
    authoritative throughout.
  spec_section: "rfc-mcp-mandate-extension.md §5, §7, §11; RFC #14 SOQ2 (ratified ±300 s)"
  conformance_level: extended
  track: T11

guard_config:
  enforcement: required
  clock_skew_seconds: 300
  registry: null

clock: "2026-08-01T00:00:00Z"

steps:
  - call:
      tool: pact_agents
      arguments:
        documentId: doc_vec123
      meta:
        au.tailor.pact/mandate:
          version: "1"
          session_id: sess_vec
          agent_id: agent_vec
          handler_principal_id: did:web:knox.example
          asserted_at: "2026-08-01T00:10:00Z"   # 600 s ahead of server time
          expires_at: "2026-08-02T00:00:00Z"
          signature: base64url-vector-signature
          signing_key_id: "did:web:knox.example#key-1"
    expected:
      outcome: error
      error: { name: MandateClockSkew, code: -32017 }

notes: |
  The shepherd synthesis ratified reuse of §17.7's ±5-minute configurable
  window (SOQ2); the RFC draft's 30 s was NOT adopted. Implementations
  advertising maxClockSkewMs MUST default to 300000.

failure_classification:
  severity: warning
  common_causes:
    - Shipping the RFC draft's 30 s default instead of the ratified 300 s.
    - Skew applied to expires_at (expiry is absolute against server time; skew is for asserted client time).
