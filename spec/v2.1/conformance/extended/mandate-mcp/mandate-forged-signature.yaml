# Conformance test vector — Extended: structurally unverifiable mandate rejected.
# kind: mandate (provisional) — missing required envelope field ⇒ MandateInvalidSignature.

kind: mandate

metadata:
  id: extended/mandate-mcp/mandate-forged-signature
  description: >
    A mandate missing a required field (signature absent) cannot be verified and
    is rejected with MandateInvalidSignature (-32011). This pins the STRUCTURAL
    failure mode; the cryptographic-forgery variant (a present-but-invalid
    signature over the canonical body, mirroring verify-fido2-forged-signature)
    lands when type-defined mandate crypto is specified at promotion (#35).
  spec_section: "rfc-mcp-mandate-extension.md §7, §11"
  conformance_level: extended
  track: T11

guard_config:
  enforcement: required
  clock_skew_seconds: 300
  registry: null

clock: "2026-08-01T00:00:00Z"

steps:
  - call:
      tool: pact_agents
      arguments:
        documentId: doc_vec123
      meta:
        au.tailor.pact/mandate:
          version: "1"
          session_id: sess_vec
          agent_id: agent_vec
          handler_principal_id: did:web:knox.example
          expires_at: "2026-08-02T00:00:00Z"
          # signature deliberately absent
          signing_key_id: "did:web:knox.example#key-1"
    expected:
      outcome: error
      error: { name: MandateInvalidSignature, code: -32011 }

notes: |
  Honesty constraint: implementations MUST NOT report signatures as
  cryptographically verified while performing structural checks only. The
  verdict notes must state the deferral explicitly.

failure_classification:
  severity: blocker
  common_causes:
    - Missing fields silently tolerated (mandate treated as optional metadata).
    - Structural checks reported as cryptographic verification.
