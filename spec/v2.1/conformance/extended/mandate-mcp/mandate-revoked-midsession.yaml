# Conformance test vector — Extended: revocation takes effect on the very next request.
# kind: mandate (provisional) — per-request verification ⇒ immediate revocation (ratified OQ1).

kind: mandate

metadata:
  id: extended/mandate-mcp/mandate-revoked-midsession
  description: >
    Request N verifies against a live signing key and passes. The key is then
    revoked in the registry. Request N+1 under the same mandate is rejected
    with MandateRevoked (-32013). There is no session to finish: verification
    verdicts MUST NOT be cached across requests (RFC §7/§10).
  spec_section: "rfc-mcp-mandate-extension.md §7, §10; RFC #14 OQ1 (ratified: immediate)"
  conformance_level: extended
  track: T11

guard_config:
  enforcement: required
  clock_skew_seconds: 300
  registry:
    principals:
      - id: did:web:knox.example
        credentials:
          - id: key-1
            revoked: false

clock: "2026-08-01T00:00:00Z"

steps:
  - call:
      tool: pact_agents
      arguments:
        documentId: doc_vec123
      meta:
        au.tailor.pact/mandate: &mandate
          version: "1"
          session_id: sess_vec
          agent_id: agent_vec
          handler_principal_id: did:web:knox.example
          identity_claim: vector fixture agent
          escalation_hook: https://relay.knox.example/agent-vec/escalations
          expires_at: "2026-08-02T00:00:00Z"
          alg: eddsa-ed25519
          signature: base64url-vector-signature
          signing_key_id: "did:web:knox.example#key-1"
    expected:
      outcome: pass
  - registry_update:            # out-of-band revocation between requests
      principals:
        - id: did:web:knox.example
          credentials:
            - id: key-1
              revoked: true
  - call:
      tool: pact_agents
      arguments:
        documentId: doc_vec123
      meta:
        au.tailor.pact/mandate: *mandate
    expected:
      outcome: error
      error: { name: MandateRevoked, code: -32013 }

notes: |
  This is the transport-level half of ratified OQ1. The PACT fabric's
  obligation — terminating the Parley with outcome=mandate_revoked — is
  §19–20 (#35) territory and out of scope at the MCP boundary. Digest-mode
  caching of mandate BODIES is permitted; caching verification VERDICTS is
  what this vector forbids.

failure_classification:
  severity: blocker
  common_causes:
    - Verification verdict cached across requests, letting revoked keys keep working.
    - Registry read once at startup instead of per verification.
