# Conformance test vector — Extended: create a narrowly-scoped service account.
# kind: http. §22.3 happy path.
#
# The assertion that matters is the SCOPE ECHO: the server must return the
# scope it actually stored. A server that accepts a scope and stores something
# broader has silently widened a grant, and the caller has no way to detect it
# except by reading the response back.

kind: http

metadata:
  id: extended/service-accounts/service-account-create-scoped
  description: A handler creates a service account scoped to one resource, one section, two operations, and mandate-minting capped at disclosure ceiling 2. The server echoes the stored scope exactly and returns the credential once.
  spec_section: "§22.3"
  conformance_level: extended
  track: T5

preconditions:
  request_context:
    auth: bearer
    principal_id: did:web:knox.example

request:
  method: POST
  path: /api/pact/service-accounts
  headers:
    Content-Type: application/json
  body:
    name: aloomu-nightly-reconciler
    owner_principal_id: did:web:knox.example
    scope:
      resources:
        - doc_xyz
      sections:
        - sec:budget
      operations:
        - read
        - propose
      mandates:
        may_mint: true
        max_disclosure_ceiling: 2
    expires_at: "2026-11-12T00:00:00Z"

expected_response:
  status: 200
  body_match:
    mode: subset
    value:
      name: aloomu-nightly-reconciler
      owner_principal_id: did:web:knox.example
      scope:
        resources:
          - doc_xyz
        sections:
          - sec:budget
        operations:
          - read
          - propose
        mandates:
          may_mint: true
          max_disclosure_ceiling: 2
  body_ignore_fields:
    - service_account_id
    - created_at
    - credential

postconditions:
  server_state:
    events_added: 0

notes: |
  - `credential` is ignored for matching (it is server-generated) but §22.3
    requires it to be present on create and NEVER retrievable afterwards. A
    companion vector asserting that GET omits it is worth adding once a live
    implementation exists.
  - The scope is asserted in full rather than as a loose subset, precisely to
    catch silent widening — e.g. a server that ignores `sections` and grants
    the whole resource would pass a looser match.
  - `may_mint: true` grants the account permission to mint Mandates. It does
    NOT let the account sign one: per §20.5 step 4 the Mandate signature is
    always the HumanPrincipal's. A service account never signs a Mandate on a
    human's behalf.

failure_classification:
  severity: warning
  common_causes:
    - Server stores a broader scope than requested (silent widening at creation)
    - Server ignores the `sections` dimension and grants whole-resource access
    - credential returned on subsequent GETs (§22.3 requires create/rotate only)
    - max_disclosure_ceiling not enforced when the account later mints a Mandate
