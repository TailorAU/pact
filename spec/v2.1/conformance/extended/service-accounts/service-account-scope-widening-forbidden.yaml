# Conformance test vector — Extended: a scope update MUST NOT widen. kind: http.
#
# §22.3 permits narrowing and forbids widening, so that every widening is a
# NEW account and therefore a visible event in the audit trail. Allowing
# in-place widening means a long-lived account's current authority cannot be
# reconstructed from its creation record — which is the property the audit
# trail exists to provide.

kind: http

metadata:
  id: extended/service-accounts/service-account-scope-widening-forbidden
  description: An update attempts to add a resource and the `close` operation to an existing service account's scope. The server MUST reject with scope.widening_forbidden and leave the stored scope unchanged; widening requires creating a new account so the grant is always visible in the audit trail.
  spec_section: "§22.3"
  conformance_level: extended
  track: T5

preconditions:
  server_state:
    service_account:
      service_account_id: sa_reconciler_1
      scope:
        resources:
          - doc_xyz
        operations:
          - read
          - propose
  request_context:
    auth: bearer
    principal_id: did:web:knox.example

request:
  method: POST
  path: /api/pact/service-accounts/sa_reconciler_1
  headers:
    Content-Type: application/json
  body:
    scope:
      resources:
        - doc_xyz
        - doc_secret                         # WIDENING: a resource not previously granted
      operations:
        - read
        - propose
        - close                              # WIDENING: an operation not previously granted

expected_response:
  status: 403
  body_match:
    mode: subset
    value:
      code: scope.widening_forbidden
  body_ignore_fields:
    - request_id
    - timestamp
    - message

postconditions:
  server_state:
    events_added: 0
    resource_modified: false                 # stored scope unchanged

notes: |
  - Two dimensions widen at once (a resource and an operation) so the vector
    catches an implementation that checks only one. A server that validates
    `resources` but not `operations` would pass a single-dimension test.
  - The mirror case — a narrowing update — MUST succeed. Worth a companion
    vector once a live implementation exists; a server that rejects ALL scope
    updates would pass this vector while failing §22.3's narrowing allowance.
  - `resource_modified: false` asserts the rejection is atomic. A server that
    applies the narrowing parts and rejects the widening parts has produced a
    scope neither the caller nor the record predicts.

failure_classification:
  severity: blocker
  common_causes:
    - Server applies the widened scope (audit trail no longer reconstructs current authority from the creation record)
    - Server checks only one scope dimension for widening
    - Server partially applies the update before rejecting, leaving an unpredictable stored scope
    - Server rejects all updates including narrowing, making least-privilege tightening impossible
