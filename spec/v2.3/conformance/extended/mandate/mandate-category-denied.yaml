# Conformance test vector — Extended: publish outside may_publish rejected.
# kind: mandate (provisional) — constraint-envelope category check on a publishing tool.

kind: mandate

metadata:
  id: extended/mandate/mandate-category-denied
  description: >
    A publishing call whose explicit category is not in the mandate's
    may_publish list is rejected with MandateCategoryDenied (-32014). A
    publishing call with NO category argument is permitted with an honesty
    note — the category is not determinable at the MCP boundary.
  spec_section: "spec/v2.3 §19.5, §20.7; rfc-mcp-mandate-extension.md §8, §11"
  conformance_level: extended
  track: T11

guard_config:
  enforcement: required
  clock_skew_seconds: 300
  registry: null

clock: "2026-08-01T00:00:00Z"

steps:
  - call:
      tool: pact_constrain
      arguments:
        documentId: doc_vec123
        sectionId: "sec:pricing"
        boundary: total must not exceed $2M
        category: pricing
      meta:
        au.tailor.pact/mandate: &mandate
          version: "1"
          session_id: sess_vec
          agent_id: agent_vec
          handler_principal_id: did:web:knox.example
          constraint_envelope:
            may_publish: [interface, performance]
          expires_at: "2026-08-02T00:00:00Z"
          signature: base64url-vector-signature
          signing_key_id: "did:web:knox.example#key-1"
    expected:
      outcome: error
      error: { name: MandateCategoryDenied, code: -32014 }
  - call:
      tool: pact_intent
      arguments:
        documentId: doc_vec123
        sectionId: "sec:intro"
        goal: uncategorised intent
      meta:
        au.tailor.pact/mandate: *mandate
    expected:
      outcome: error
      error: { name: MandateCategoryDenied, code: -32014 }
  - call:
      tool: pact_intent
      arguments:
        documentId: doc_vec123
        sectionId: "sec:intro"
        goal: uncategorised intent under an unscoped mandate
      meta:
        au.tailor.pact/mandate:
          version: "1"
          session_id: sess_vec
          agent_id: agent_vec
          handler_principal_id: did:web:knox.example
          constraint_envelope: {}
          expires_at: "2026-08-02T00:00:00Z"
          signature: base64url-vector-signature
          signing_key_id: "did:web:knox.example#key-1"
    expected:
      outcome: pass
      verdict:
        verified: true

notes: |
  Category enforcement reaches exactly the tools whose schemas declare a
  `category` argument (pact_intent, pact_constrain) — the MCP SDK strips
  undeclared arguments before the guard runs, so a check on any other tool
  would be dead code. Under a mandate that scopes may_publish, those tools
  REQUIRE a category (step 2, fail closed): an agent can always supply one,
  and permitting uncategorised publishes would make the strictest expressible
  mandate restrict nothing. Without may_publish scoping (step 3) no category
  is required.

failure_classification:
  severity: blocker
  common_causes:
    - may_publish enforced on tools that cannot carry a category (dead code at the wire).
    - Uncategorised publishes permitted under a scoped mandate (envelope unenforceable).
