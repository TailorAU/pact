# Conformance test vector — Extended: stale escalation proof rejected for clock skew.
# kind: mandate (provisional) — SOQ2 ratified skew: §17.7's ±5 minutes, NOT the RFC draft's 30 s.

kind: mandate

metadata:
  id: extended/mandate/mandate-clock-skew
  description: >
    An escalation-retry authorization_proof whose asserted_at is outside the
    ±300 s freshness window (here: 10 minutes stale) is rejected with
    MandateClockSkew (-32017). The proof's asserted_at is the client-time
    signal the window applies to (§17.7 step 4). The RFC #14 Mandate body has
    NO client-time field — verbatim carriage forbids inventing one — so no
    skew check applies to the mandate itself; mandate expiry is absolute
    against the server clock (see mandate-expired-rejected).
  spec_section: "spec/v2.3 §20.6, §20.7; rfc-mcp-mandate-extension.md §5, §9, §11; PACT §17.7 step 4; RFC #14 SOQ2 (ratified ±300 s)"
  conformance_level: extended
  track: T11

guard_config:
  enforcement: required
  clock_skew_seconds: 300
  registry: null

clock: "2026-08-01T00:00:00Z"

steps:
  - call:
      tool: pact_done
      arguments: &args
        documentId: doc_vec123
        status: aligned
      meta:
        au.tailor.pact/mandate: &mandate
          version: "1"
          session_id: sess_vec
          agent_id: agent_vec
          handler_principal_id: did:web:knox.example
          commitment_authority:
            max_binding_decisions: 0
          expires_at: "2026-08-02T00:00:00Z"
          signature: base64url-vector-signature
          signing_key_id: "did:web:knox.example#key-1"
    expected:
      outcome: input_required
      capture:
        request_state: requestState
        challenge_nonce: inputRequests[0].challenge_nonce
  - call:
      tool: pact_done
      arguments: *args
      meta:
        au.tailor.pact/mandate: *mandate
        au.tailor.pact/mandate-escalation:
          request_state: "{captured.request_state}"
          authorization_proof:
            type: fido2-assertion
            principal_id: did:web:knox.example
            credential_id: cred_vec
            challenge_nonce: "{captured.challenge_nonce}"
            asserted_at: "2026-07-31T23:50:00Z"   # 600 s stale against the 00:00:00Z clock
            signature: base64url-proof-signature
    expected:
      outcome: error
      error: { name: MandateClockSkew, code: -32017 }

notes: |
  The shepherd synthesis ratified reuse of §17.7's ±5-minute configurable
  window (SOQ2); the RFC #14 draft's 30 s was NOT adopted. Implementations
  advertising maxClockSkewMs MUST default to 300000. An earlier revision of
  this vector applied the window to a mandate-body `asserted_at` field — that
  field does not exist in the RFC #14 shape and checking it violated verbatim
  carriage; this revision pins the correct surface.

failure_classification:
  severity: warning
  common_causes:
    - Shipping the RFC draft's 30 s default instead of the ratified 300 s.
    - Skew applied to mandate expires_at (expiry is absolute against server time).
    - Skew checked against an invented mandate-body time field (verbatim-carriage violation).