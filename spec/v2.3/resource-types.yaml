# PACT resource-type registry (v2.3)
#
# Machine-readable index of well-known resource types, referenced from
# SPECIFICATION.md §14.3. Each entry conforms to the table in §14.3:
# type / field_schema / proposal_payload / apply_semantics / terminal_states
# / content_format / effect_class / human_attestation / maintainer / status.
#
# v2.3 adds the two apply-guard fields (§25.5, §25.6):
#
#   effect_class:       internal-reversible | external-irreversible
#                       What the apply does IN THE WORLD, not what the type is
#                       called. `internal-reversible` means the apply changes
#                       only state inside the PACT implementation and the prior
#                       state is restorable from its own event log (§6).
#                       `external-irreversible` means the effect leaves the
#                       system, moves value, or is asserted to bind a person or
#                       entity. An entry that OMITS this field MUST be read as
#                       `external-irreversible` — unclassified is not internal.
#
#   human_attestation:  required | not-required
#                       `required` engages the §25.6 fail-closed apply guard:
#                       silence, TTL expiry, absence of objection, agent
#                       consensus and `auto` / `objection-based` policies MUST
#                       NOT cause the apply. It proceeds only after the six
#                       §25.7 checks pass, or the effect is re-declared
#                       out-of-band under §25.6(b).
#                       `required` MUST accompany
#                       `effect_class: external-irreversible`.
#
# These registry values are a FLOOR, not a ceiling. An implementation whose own
# apply is more consequential than the registry says MUST classify it upward in
# its /.well-known/pact.json profile (§15.1 `effectClass` / `humanAttestation`)
# — never downward.
#
# To register a custom resource type: open a PR against this file. Custom
# types SHOULD use reverse-domain notation (com.example.case-file). An
# implementation that supports a type MUST declare it in its
# /.well-known/pact.json profile (§15).

version: "2"
spec_version: "v2.3"
last_updated: "2026-08-26"

types:

  # ─── Built-in (defined in §14.2) ────────────────────────────────────────

  - type: document
    status: built-in
    field_schema: "sec:{slug}  — heading-derived section path; child sections use sec:{slug}/{child-slug}"
    proposal_payload: "{ sectionId, newContent, summary, reasoning? }"
    apply_semantics: Text replacement within the addressed Markdown section.
    terminal_states: [Merged]
    content_format: "text/markdown (also html, docx, pdf via section projection — §8)"
    effect_class: internal-reversible
    human_attestation: not-required
    maintainer: TailorAU
    notes: >-
      The default resource type. Proposals without an explicit `type` field are
      treated as document proposals. `Merged` is a DRAFT outcome — it is not
      `signed` or `executed` (§25.8). An implementation whose document apply
      also publishes to an external system, dispatches the document to a
      counterparty, or asserts execution MUST classify that apply upward to
      `external-irreversible` in its own profile (§25.5).

  - type: transaction
    status: built-in
    field_schema: "txn:{field}  — structured transaction fields (txn:amount, txn:recipient, txn:method, …)"
    proposal_payload: "{ amount, recipient, method, reference }"
    apply_semantics: >-
      Payment settled. GUARDED — see effect_class / human_attestation below.
    terminal_states: [Settled, AwaitingAttestation, Aligned]
    content_format: application/json
    effect_class: external-irreversible
    human_attestation: required
    maintainer: TailorAU
    notes: >-
      v2.3 correction: silence / TTL expiry / consensus MUST NOT settle,
      authorize or execute a transaction (§25.6). On TTL expiry with no
      objection the implementation fails closed to `AwaitingAttestation` and
      emits `pact.apply.blocked`, or declares settlement out-of-band under
      §25.6(b) — in which case the terminal state is `Aligned`, not `Settled`.
      Reference impl (planned) — Baink.

  - type: fact
    status: built-in
    field_schema: "claim:{id}  — knowledge-claim identifier"
    proposal_payload: "{ claim, evidence, tier, sources }"
    apply_semantics: Fact verified into the implementation's own knowledge graph.
    terminal_states: [Verified]
    content_format: application/json
    effect_class: internal-reversible
    human_attestation: not-required
    maintainer: TailorAU
    notes: >-
      Classified internal-reversible only because the built-in apply writes to
      the implementation's own graph and is revocable from its event log. An
      implementation that publishes verified facts to a third party, a public
      register, or any surface it cannot retract MUST classify that apply
      upward to `external-irreversible` (§25.5). `Verified` is a protocol
      state — it is not an assertion of truth, provenance, or legal
      admissibility. Reference impl — Source.

  - type: record
    status: built-in
    field_schema: "rec:{field}  — structured record fields (e.g. clinical record fields)"
    proposal_payload: "{ field, value, justification }"
    apply_semantics: >-
      Record finalised. GUARDED — see effect_class / human_attestation below.
    terminal_states: [Finalized, AwaitingAttestation]
    content_format: application/json
    effect_class: external-irreversible
    human_attestation: required
    maintainer: TailorAU
    notes: >-
      Finalising a clinical or official record is an attributable act that the
      implementation cannot unilaterally undo, and downstream systems treat it
      as authoritative. It is therefore guarded by default: a `record` MUST NOT
      be finalised from silence, TTL expiry or agent consensus alone (§25.6).
      An implementation whose `record` apply is genuinely an internal draft may
      classify downward ONLY by registering a distinct custom type with its own
      entry — it MUST NOT advertise `internal-reversible` for the built-in
      `record` type (§14.3).

  # ─── Registered custom types ────────────────────────────────────────────

  - type: au.tailor.pact.topic
    status: registered
    field_schema: "sec:{slug}  — topic sections (Question / Answer / Evidence …); the Answer section carries the canonical claim"
    proposal_payload: "{ sectionId, newContent, summary, reasoning?, sources? } — challenges additionally carry { defeaterType, substance } per the epistemics extension"
    apply_semantics: >-
      Merge into the topic's draft sections. Promotion of the topic itself
      (open → consensus → stable/locked) is NOT the apply — it is a separate,
      recomputed consensus sweep governed by the
      `au.tailor.pact/epistemics` extension
      (docs/extensions/epistemics.md): per-tier quorum, 0.90 alignment
      ratio, and a zero-unmet-dependency gate.
    terminal_states: [Verified]
    content_format: "text/markdown (topic sections) + application/json (claim metadata: tier, credence, dependency links)"
    effect_class: internal-reversible
    human_attestation: not-required
    maintainer: TailorAU
    notes: >-
      A knowledge claim under epistemic consensus. `Verified` is a RESTING
      state, not an immutable one — every state including `Verified` remains
      re-openable through the extension's challenge machinery, and it is a
      protocol state per §25.3, never an assertion of truth. Credence is a
      deterministic PROJECTION over the dependency graph (asymptote 0.99);
      it never gates or constitutes a consensus transition. Classified
      internal-reversible because the apply writes only to the
      implementation's own graph and every transition is revocable from the
      event log (§6). An implementation that republishes verified topics to
      a third-party surface it cannot retract MUST classify that apply
      upward to `external-irreversible` in its own profile (§25.5).
      Extension doc: docs/extensions/epistemics.md
      (`au.tailor.pact/epistemics`). Reference impl — the PACT knowledge
      graph (pact.tailor.au).

  - type: au.tailor.pact.legislation-instrument
    status: registered
    field_schema: "sec:{sectionId}  — statutory section addressing within the instrument (act / part / division / section)"
    proposal_payload: "{ jurisdiction, title, identifier, sections[], sourceRef (official register / gazette URL) }"
    apply_semantics: >-
      Structured legislation instrument ingested into the implementation's
      public knowledge graph after quorum verification against the official
      source (free-ingest: 3+ independent agents verify, then the instrument
      auto-ingests). Ingest quorum and independence rules follow the
      `au.tailor.pact/epistemics` extension.
    terminal_states: [Ingested]
    content_format: application/json
    effect_class: internal-reversible
    human_attestation: not-required
    maintainer: TailorAU
    notes: >-
      GRAPH INGEST ONLY. Classified internal-reversible because the
      registered apply writes the instrument into the implementation's own
      graph, from which it can be corrected or withdrawn via its event log
      (§6) — and because the content is a copy of a public official source,
      not a novel assertion. This classification does NOT cover
      publication. Per §25.5's fail-closed doctrine ("unclassified is not
      internal", and the registry is a floor): any apply that PUBLISHES the
      instrument to a third party, feeds a downstream citation surface the
      implementation cannot retract, or asserts the ingested text is the
      authoritative law, is a DIFFERENT effect and MUST be classified
      `external-irreversible` in the implementation's own profile — with
      `human_attestation: required` per §14.3 — or declared out-of-band
      under §25.6(b). Serving the graph's own public read API, where the
      implementation can still correct or retract the record, remains
      within this entry. `Ingested` is a protocol state (§25.3): it is not
      an assertion that the text is current, authoritative, or legally
      effective. Extension doc: docs/extensions/epistemics.md. Reference
      impl — the PACT knowledge graph (pact.tailor.au).

registration_process:
  - Open a PR against this file with the entry filled out.
  - The PR's description SHOULD link to a reference implementation (running or in progress) that uses the new type.
  - >-
    The entry MUST carry `effect_class` and `human_attestation` (§14.3, §25.5).
    An entry proposing `internal-reversible` MUST state, in the PR description,
    how the prior state is restorable from the implementation's own event log.
  - "Maintainer review: confirms uniqueness of `type`, that the entry has the required fields, that apply_semantics is unambiguous, that the effect classification is honest, and that the type is genuinely new (not duplicating a built-in)."
  - On merge the type is `registered`. Implementations that support it advertise it in their /.well-known/pact.json profile.
  - "Lifecycle: a `registered` type can be moved to `deprecated` by the original maintainer or by maintainer review (e.g. superseded by a better type); deprecated types remain in the registry for citation stability."

custom_type_naming:
  rule: "Reverse-domain notation: e.g. com.example.case-file, au.gov.mygovid-document. Bare identifiers are reserved for built-ins."
  case: "lower-kebab segments separated by dots."

apply_guard:
  spec_section: "§25.5, §25.6"
  default_when_unclassified: external-irreversible
  guard_engaged_when: "effect_class == external-irreversible OR human_attestation == required"
  policies_that_must_not_bypass: [auto, single, majority, unanimous, objection-based]
  on_guard_hit:
    - "Do not apply. Transition the proposal to AwaitingAttestation (non-terminal)."
    - "Emit pact.apply.blocked with reason + effect_class + required_principals."
    - "Raise a §6.5 pending obligation of kind: sign against each required principal."
    - "A further TTL expiry re-emits pact.apply.blocked; it never releases the guard."
  release_requires: "All six §25.7 checks — presence, §17.7 verification, principal binding, payload binding, scope binding, application-layer authority."
